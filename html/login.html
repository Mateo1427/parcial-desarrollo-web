<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stanford University</title>
    <link rel="stylesheet" href="../css/header_footer_styles.css">
    <link rel="stylesheet" href="../css/login.css">

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="../js/header_footer.js" defer></script>
    <script src="../js/login.js" defer></script>
</head>

<body>
    <header>
        <div class="menu">
            <div class="logo_container">
                <img src="../img/logo_menu.png" alt="stanford-logo-menu" />
                <h1>Stanford</h1>
            </div>
            <div class="menu_options">
                <ul>
                    <li><a href="./index.html">Inicio</a></li>
                    <li><a href="./programs.html">Facultades</a></li>
                    <li><a href="./campus.html">Campus</a></li>
                    <li><a href="./admissions.html">Admisiones</a></li>
                    <li><a href="./contact.html">Contacto</a></li>
                </ul>
                <div class="menu-buttons">
                    <ul>
                        <li><a href="./login.html"><button>Login</button></a></li>
                        <li><a href="./register.html"><button>Registro</button></a></li>
                    </ul>
                </div>
            </div>
        </div>
        <ul class="hide-show-btns">
            <li><a><button id="hide-btn">Ocultar Menú</button></a></li>
            <li><a><button id="show-btn">Mostrar Menú</button></a></li>
        </ul>
    </header>
    <main>
        <div class="login_section">
            <h1>Inicio de Sesión</h1>
            <div class="login_info">
                <form action="">
                    <label for="code">Username: </label>
                    <input id="username-form" type="text" placeholder="123456789">
                    <br>
                    <label for="password">Contraseña: </label>
                    <input id="password-form" type="password" placeholder="**********">
                    <br>
                    <div class="buttons_form">
                        <input type="reset" value="Limpiar">
                        <button id="btn-login" >Iniciar Sesión</button>
                    </div>
                </form>
            </div>
            <p>No tienes una cuenta? <a href="./register.html">Registrate aquí!</a></p>
            <img src="../img/logo_login.png" alt="Logo_Stanford" width="300px">
        </div>
    </main>
    <footer>
        <div class="footer_container">
            <div class="logo_footer">
                <img src="../img/logo_footer.png" alt="stanford-logo-footer">
                <p><em>Todos los derechos reservados.</em></p>
            </div>
            <div class="social">
                <h3>Redes</h3>
                <ul>
                    <li><a href="https://web.facebook.com/Stanford/?_rdc=1&_rdr#">Facebook</a></li>
                    <li><a href="https://www.instagram.com/stanford/">Instagram</a></li>
                    <li><a href="https://x.com/Stanford">Twitter</a></li>
                    <li><a href="https://www.youtube.com/stanford">Youtube</a></li>
                </ul>
            </div>
            <div class="more_options">
                <h3>Más opciones</h3>
                <ul>
                    <li><a href="/contact.html">Contacto</a></li>
                    <li><a href="/privacy.html">Politicas de Privacidad</a></li>
                </ul>
            </div>
        </div>
    </footer>
</body>

</html>
